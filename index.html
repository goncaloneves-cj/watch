<!doctype html><html lang="pt-PT"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dynatrace Watch</title>
<link rel="apple-touch-icon" href="watch-180.png"><link rel="icon" href="watch-180.png">
<meta name="apple-mobile-web-app-title" content="Dynatrace Watch"><meta name="theme-color" content="#0b0e14">
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0e14;color:#e9edf5;
font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
img{width:96px;height:96px;border-radius:22px}h1{font-size:20px;margin:14px 0 6px}p{margin:6px 0;color:#aab3c5}b{color:#e9edf5}</style></head>
<body><main><img src="watch-180.png" alt=""><h1>Dynatrace Watch</h1><div id="m"><p>A abrir…</p></div></main>
<script>
// Lançador do painel para o ecrã principal do iPhone. O endereço do painel e a chave vêm depois do # (nunca chegam a
// este servidor) e ficam só no atalho do iPhone. Esta página não guarda nem envia nada.
(function(){
  var m=document.getElementById('m'),h=new URLSearchParams(location.hash.slice(1)),u=h.get('u')||'',k=h.get('k')||'';
  var ok=/^https:\/\/script\.google\.com\/[\w\/.-]+\/exec$/.test(u)&&/^[\w-]{8,128}$/.test(k);
  if(!ok){m.innerHTML='<p>Abre o painel no iPhone e carrega em <b>📲 Pôr no ecrã principal</b>.</p>';return;}
  if(/[?&]add\b/.test(location.search)){
    history.replaceState(null,'',location.pathname+location.hash);
    m.innerHTML='<p>Agora: <b>Partilhar → Adicionar ao ecrã principal</b> (deixa <b>Abrir como app web</b> ligado) → <b>Adicionar</b>.</p>';
    return;
  }
  location.replace(u+'?k='+encodeURIComponent(k));
})();
</script></body></html>
